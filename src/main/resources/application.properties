# ===============================
# H2 DATABASE (File Mode)
# ===============================
spring.datasource.url=jdbc:h2:file:${user.home}/nnss-db/nnss
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# H2 Console (Optional - Recommended)
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


# JWT
jwt.secret=ReplaceThisWithAStrongSecretKeyOfAtLeast32Chars!
# 1 day. NOTE: this used to have "   # 1 day" appended on the same line, which
# in a .properties file is NOT a comment (# only starts a comment at the
# start of a line) -- the value was literally the string "86400000   # 1 day".
# JwtUtil never actually read this property before, so it went unnoticed;
# now that it does, the value has to be a clean number.
jwt.expiration-ms=86400000

# Folder where employee photos are stored. Was previously a path relative to
# the source tree (src/main/resources/static/...), which only ever worked
# when running from source with Gradle/Maven -- in the packaged .exe
# (see build.gradle's dist task) that folder doesn't exist as a writable
# directory on disk, so uploads silently landed in the wrong place and
# EmployeePdfService could never find the photo again. This now points at an
# external, persistent folder next to the app data, the same pattern already
# used for the H2 database below.
file.upload-dir=${user.home}/nnss-db/uploads/employees


# ? Enable multipart uploads
spring.servlet.multipart.enabled=true

# ? File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# (optional) Temp location for uploads
spring.servlet.multipart.location=./uploads/tmp

logging.file.name=logs/app.log
logging.level.root=INFO

server.port=8888

# ===============================
# API docs (Swagger)
# ===============================
# These are left enabled by default for local development convenience.
# Swagger UI/API docs pages are loaded by the browser via plain navigation,
# which can't attach the Authorization header our JWT filter requires --
# gating them behind hasRole("ADMIN") in SecurityConfig would make the pages
# themselves unloadable rather than actually restricting access. Set both of
# these to false (e.g. via an environment variable) for any deployment that
# shouldn't expose the API schema publicly.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
